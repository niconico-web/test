<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>School Battle - 結果</title>
<meta name="theme-color" content="#667eea">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
<link rel="stylesheet" href="css/result.css?v=1783932440567">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(registration => console.log('ServiceWorker registered'))
      .catch(error => console.log('ServiceWorker registration failed'));
  });
}
</script>
</head>
<body>
<div id="resultCard">
    <h1 id="resultTitle"></h1>
    <div class="result-stats">
        <p id="turnText"></p>
        <p id="hpText"></p>
        <p id="damageText"></p>
        <p id="criticalText"></p>
        <p id="xpGainText"></p>
        <p id="coinGainText"></p>
        <p id="stealText" style="display:none"></p>
        <p id="orbText" style="display:none; color: #ffd700; font-weight: bold;"></p>
        <p id="materialDropText" style="display:none; color: #2ecc71; font-weight: bold;"></p>
        <p id="bossWeaponDropText" style="display:none; color: #ff4757; font-weight: bold;"></p>
        <p id="limitBreakMaterialText" style="display:none; color: #3742fa; font-weight: bold;"></p>
        <p id="bossSkillDropText" style="display:none; color: #f0932b; font-weight: bold;"></p>
    </div>
    <div class="buttonArea">
        <button type="button" id="retryBtn" class="btn btn-primary" style="display:none;">もう一度戦う</button>
        <button type="button" id="onlineBtn" class="btn btn-secondary" style="display:none;">オンラインへ</button>
        <button type="button" id="partyBtn" class="btn btn-secondary" style="display:none;">パーティへ</button>
        <button type="button" id="bossBtn" class="btn btn-secondary" style="display:none;">ボス戦へ</button>
        <button type="button" id="homeBtn" class="btn">ホームへ</button>
    </div>
</div>

<!-- PWA Install Prompt -->
<div id="install-popup" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>アプリとしてインストール</h2>
        <p>このアプリをホーム画面に追加して、より快適に利用しませんか？</p>
        <div class="button-group">
            <button id="install-btn" class="btn btn-primary">インストール</button>
            <button id="dismiss-install-btn" class="btn">後で</button>
        </div>
    </div>
</div>

<style>
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
}

.modal-content {
    background: #1c1e22;
    padding: 20px;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
    border: 2px solid #3498db;
}

.modal-content h2 {
    color: #3498db;
    margin-bottom: 15px;
}

.modal-content p {
    color: #ecf0f1;
    margin-bottom: 20px;
}

.button-group {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.button-group .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

.button-group .btn-primary {
    background: #3498db;
    color: white;
}

.button-group .btn {
    background: #7f8c8d;
    color: white;
}
</style>

<script src="js/i18n.js?v=1783932440567"></script>
<script src="js/stats.js?v=1783932440567"></script>
<script src="js/weapons.js?v=1783932440567"></script>
<script src="js/skillTree.js?v=1783932440567"></script>
<script src="js/materials.js?v=1783932440567"></script>
<script src="js/boss.js?v=1783932440567"></script>
<script src="js/mission.js?v=1783932440567"></script>
<script src="js/guild.js?v=1783932440567"></script>
<script src="js/result.js?v=1783932440567"></script>
</body>
</html>
